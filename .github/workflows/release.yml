# Runs when you push a version tag (e.g. v0.2.0):
#  - publishes @gauravgupta0612/ai-native-common to npm (needs the NPM_TOKEN repository secret)
#  - warms up the JitPack build so the Java library is ready for users
#  - creates a GitHub release with install instructions
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write   # npm provenance (proves the package was built from this repository)

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  jitpack:
    name: Build on JitPack
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build
        run: |
          URL="https://jitpack.io/com/github/gauravgupta0612/ai-native-dev-platform/${GITHUB_REF_NAME}/build.log"
          curl -sS --max-time 600 "$URL" | tail -20 || true

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [npm]
    steps:
      - uses: actions/checkout@v5
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          **npm**
          \`\`\`bash
          npm install @gauravgupta0612/ai-native-common@${GITHUB_REF_NAME#v}
          \`\`\`

          **Maven** (add the JitPack repository first, see README)
          \`\`\`xml
          <dependency>
            <groupId>com.github.gauravgupta0612</groupId>
            <artifactId>ai-native-common</artifactId>
            <version>${GITHUB_REF_NAME}</version>
          </dependency>
          \`\`\`

          **pip**
          \`\`\`bash
          pip install "git+https://github.com/gauravgupta0612/ai-native-dev-platform.git@${GITHUB_REF_NAME}#subdirectory=common/python"
          \`\`\`
          NOTES
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
