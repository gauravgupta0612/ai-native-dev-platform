# Platform server + local Ollama. Secrets come from an .env file next to this compose file (never commit it).
services:
  platform:
    build:
      context: ../..
      dockerfile: enterprise/custom-deployment/Dockerfile
    env_file: .env
    environment:
      DEPLOYMENT_PROFILE: hybrid
      OLLAMA_BASE_URL: http://ollama:11434
      PLATFORM_HOST: 0.0.0.0
      PLATFORM_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"   # put a TLS reverse proxy in front for remote access
    volumes:
      - platform-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
volumes:
  platform-data:
  ollama-models:
