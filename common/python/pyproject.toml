[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-common"
version = "0.2.0"
description = "Reusable AI platform building blocks: model providers, router, agent runtime, tools, guardrails, audit log."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gauravgupta0612" }]
dependencies = []  # standard library only
keywords = ["ai", "llm", "agent", "openai", "anthropic", "claude", "gemini", "ollama", "guardrails", "security"]

[project.urls]
Homepage = "https://github.com/gauravgupta0612/ai-native-dev-platform"
Source = "https://github.com/gauravgupta0612/ai-native-dev-platform/tree/main/common/python"
Issues = "https://github.com/gauravgupta0612/ai-native-dev-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]
